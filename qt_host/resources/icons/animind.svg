<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient (dark navy) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#1a1630"/>
    </linearGradient>

    <!-- Outer glow gradient for the background -->
    <radialGradient id="glowBg" cx="55%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#2d1a4a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d0b18" stop-opacity="0"/>
    </radialGradient>

    <!-- Main logo gradient: purple top-left → pink/magenta bottom-right -->
    <linearGradient id="logoGrad" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c040ff"/>
      <stop offset="45%"  stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>

    <!-- Lightning bolt gradient: deep purple → blue-purple -->
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#7c3aed" flood-opacity="0.45"/>
    </filter>

    <!-- Glow filter for the icon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip path for rounded square -->
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <g clip-path="url(#roundedSquare)">
    <!-- Base dark background -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Subtle radial glow in center-right -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glowBg)"/>

    <!-- Very subtle inner border highlight (glassmorphism edge) -->
    <rect x="1" y="1" width="1022" height="1022" rx="223" ry="223"
          fill="none" stroke="rgba(180,100,255,0.15)" stroke-width="2"/>

    <!-- ── Play button outline (thick stroke triangle) ── -->
    <!--
      Equilateral-ish play triangle, pointing right, thick stroke
      Center: (540, 512), size: ~460px
      Vertices: left-top (310, 230), left-bottom (310, 794), right-tip (780, 512)
    -->
    <polygon
      points="295,215  295,809  790,512"
      fill="none"
      stroke="url(#logoGrad)"
      stroke-width="72"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#shadow)"
    />

    <!-- ── Lightning bolt cut through the play triangle ──
         The bolt goes from upper-center of the triangle downward,
         splitting through the left side like a crack / lightning.
         Points form a zigzag bolt shape.
    -->
    <polygon
      points="
        460,215
        380,490
        450,490
        340,809
        530,540
        455,540
      "
      fill="url(#boltGrad)"
      filter="url(#shadow)"
    />

    <!-- Bottom shadow/reflection -->
    <ellipse cx="512" cy="890" rx="280" ry="28"
             fill="#7c3aed" opacity="0.12"/>
  </g>
</svg>
